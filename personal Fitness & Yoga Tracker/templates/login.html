{% extends "base.html" %}
{% block title %}Login - YogaFlow{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <h1>🧘 Welcome to YogaFlow</h1>
        <p class="subtitle">Your Personal Fitness & Yoga Tracker</p>

        <form method="POST" class="login-form">
            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" name="email" placeholder="your@email.com" required>
            </div>

            <div class="form-group">
                <label>👤 Name</label>
                <input type="text" name="name" placeholder="Your Name">
            </div>

            <div class="form-group">
                <label>🧘 Fitness Level</label>
                <select name="level">
                    <option value="beginner">🌱 Beginner</option>
                    <option value="intermediate">⚡ Intermediate</option>
                    <option value="advanced">🔥 Advanced</option>
                </select>
            </div>

            <div class="form-group">
                <label>🎯 Goal</label>
                <select name="goal">
                    <option value="general">General Wellness</option>
                    <option value="weight_loss">Weight Loss</option>
                    <option value="stress_relief">Stress Relief</option>
                    <option value="flexibility">Flexibility</option>
                    <option value="strength">Strength Building</option>
                </select>
            </div>

            <div class="form-group">
                <label>⏱️ Minutes per Day</label>
                <input type="number" name="time_per_day" value="30" min="10" max="120" step="5">
            </div>

            <button type="submit" class="btn-primary">Begin Journey 🙏</button>
        </form>
    </div>
</div>
{% endblock %}
